name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - run: npm ci

      - name: The tag matches every package version
        run: |
          node -e "const fs = require('fs'); const bad = fs.readdirSync('packages').filter((d) => 'v' + require('./packages/' + d + '/package.json').version !== process.env.GITHUB_REF_NAME); if (bad.length) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match: ' + bad.join(', ')); process.exit(1); }"

      - run: npm run format:check
      - run: node --test tests/*.test.mjs

      - name: Publish the packages that are not on the registry yet
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "Skipped $name@$version, it is already published"
            else
              npm publish "$dir" --provenance --access public
              echo "Published $name@$version"
            fi
          done
